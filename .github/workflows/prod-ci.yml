name: node-app CI

# Run on prod pushes except when only Helm values change (avoids loop after GitOps commit).
on:
  push:
    branches:
      - prod
    paths-ignore:
      - "node-app/values.yaml"

permissions:
  contents: write
  id-token: write

env:
  AWS_REGION: us-east-2
  ECR_REGISTRY: 942010118414.dkr.ecr.us-east-2.amazonaws.com
  ECR_REPOSITORY: tc2-prod-node-app
  APP_DIR: app

jobs:
  build-and-push:
    name: Build And Push prod Image
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: prod

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: github-actions-prod-ecr
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Prepare image URI
        id: prep
        run: |
          echo "image_uri=${ECR_REGISTRY}/${ECR_REPOSITORY}" >> "$GITHUB_OUTPUT"

      - name: Set image tag (commit SHA)
        id: vars
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          docker build \
            -t "${{ steps.prep.outputs.image_uri }}:${IMAGE_TAG}" \
            "${APP_DIR}"

      - name: Push Docker image to ECR
        run: |
          docker push "${{ steps.prep.outputs.image_uri }}:${IMAGE_TAG}"

      - name: Output image info
        run: |
          echo "Image pushed:"
          echo "${{ steps.prep.outputs.image_uri }}:${IMAGE_TAG}"

      # Classic GitOps: record the immutable tag in Git so Argo CD sees a diff and syncs.
      - name: Bump image tag in Helm values and push
        run: |
          set -euo pipefail
          VALUES_FILE="node-app/values.yaml"
          sed -i "s/^  tag: \".*\"/  tag: \"${IMAGE_TAG}\"/" "${VALUES_FILE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${VALUES_FILE}"
          if git diff --staged --quiet; then
            echo "No values change; skipping commit."
            exit 0
          fi
          git commit -m "chore(prod): bump node-app image to ${IMAGE_TAG} [skip ci]"
          git push origin HEAD:prod